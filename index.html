
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Darts Knockout</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:600px;margin:auto;padding:16px 14px 32px}h1{margin:5px 0;font-size:30px}.sub{color:#aab6ca;margin-bottom:15px}
.card{background:#151e31;border:1px solid #2b3853;border-radius:20px;padding:16px;margin:12px 0}h2{margin:0 0 12px}
.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;color:#aab6ca;font-size:13px;margin-bottom:5px}
input,select,button{width:100%;padding:13px;border-radius:13px;font-size:16px}
input,select{background:#0d1424;color:#fff;border:1px solid #34425e}button{border:0;background:#f59e0b;color:#111827;font-weight:900;margin-top:10px}
button.secondary{background:#29364f;color:#fff}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:#0d1424;border-radius:15px;padding:12px}.active{outline:3px solid #f59e0b}
.name{font-size:17px;font-weight:900}.number{font-size:38px;font-weight:950}.muted,.small{color:#aab6ca}.status{font-size:13px}.killer{color:#4ade80;font-weight:900}
.hearts{font-size:21px;margin:4px 0}.progress{height:8px;background:#27334a;border-radius:20px;overflow:hidden}.fill{height:100%;background:#f59e0b}
.turnbox{text-align:center;background:#f59e0b;color:#111827;border-radius:15px;padding:12px;margin:10px 0;font-size:21px;font-weight:950}
.phase{color:#fbbf24;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.08em}.notice{background:#0d1424;padding:12px;border-radius:13px;margin-top:10px;line-height:1.35}
.mult{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mult button{margin:0;background:#29364f;color:white}.mult button.selected{background:#f59e0b;color:#111827;outline:3px solid #fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.grid button{margin:0;background:#202c44;color:#fff;padding:12px 4px}
.my{outline:2px solid #22c55e}.opp{outline:2px solid #ef4444}.hidden{display:none}.win{text-align:center;font-size:27px;font-weight:950}
.dartrow{display:flex;gap:7px;margin-top:8px}.dart{flex:1;background:#0d1424;border:1px solid #34425e;border-radius:10px;padding:8px;text-align:center;font-size:12px}
</style>
</head>
<body>
<div class="app">
<h1>🎯 Darts Knockout</h1>
<div class="sub">3 pijlen per beurt • Single 1 • Double 2 • Triple 3</div>

<section id="setup" class="card">
<div class="phase">Spel instellen</div><h2>Wie spelen er?</h2>
<div class="row"><div><label>Speler 1</label><input id="p1" value="Speler 1"></div><div><label>Speler 2</label><input id="p2" value="Tegenstander"></div></div>
<label style="margin-top:10px">Tegenstander</label>
<select id="mode"><option value="human">👤 Echte tegenspeler</option><option value="bot">🤖 Bot</option></select>
<h2 style="margin-top:18px">Kies jullie nummers</h2>
<div class="row"><div><label>Nummer speler 1</label><input id="n1" type="number" min="1" max="20"></div><div><label>Nummer speler 2</label><input id="n2" type="number" min="1" max="20"></div></div>
<button onclick="start()">Start wedstrijd 🎯</button>
</section>

<section id="game" class="hidden">
<div class="turnbox" id="turnbox"></div>
<div class="card"><div class="phase" id="phase"></div>
<div class="players">
<div class="player" id="c1"><div class="name" id="name1"></div><div class="small">Eigen nummer</div><div class="number" id="num1"></div><div id="s1" class="status"></div><div id="h1" class="hearts"></div><div class="small">Killer-teller: <span id="pr1"></span></div><div class="progress"><div id="bar1" class="fill"></div></div></div>
<div class="player" id="c2"><div class="name" id="name2"></div><div class="small">Eigen nummer</div><div class="number" id="num2"></div><div id="s2" class="status"></div><div id="h2" class="hearts"></div><div class="small">Killer-teller: <span id="pr2"></span></div><div class="progress"><div id="bar2" class="fill"></div></div></div>
</div></div>

<div id="throw" class="card">
<div class="phase">Pijl <span id="dartnum">1</span> van 3</div>
<div class="notice" id="rules"></div>
<div class="mult">
<button id="single" onclick="setMult(1)">SINGLE ×1</button>
<button id="double" onclick="setMult(2)">DOUBLE ×2</button>
<button id="triple" onclick="setMult(3)">TRIPLE ×3</button>
</div>
<div class="notice">Kies daarna het nummer dat je hebt geraakt.</div>
<div class="grid" id="grid"></div>
<div class="dartrow" id="dartrow"></div>
<div class="notice" id="msg"></div>
</div>

<div id="win" class="card hidden"><div class="win" id="winmsg"></div><button class="secondary" onclick="location.reload()">Nieuwe wedstrijd</button></div>
</section></div>

<script>
let g=null;
const $=id=>document.getElementById(id);

function start(){
 const a=$('p1').value.trim()||'Speler 1',b=$('p2').value.trim()||'Speler 2';
 const n1=+$('n1').value,n2=+$('n2').value;
 if(n1<1||n1>20||n2<1||n2>20||n1===n2){alert('Kies twee verschillende nummers van 1 t/m 20.');return}
 g={a,b,n1,n2,bot:$('mode').value==='bot',h1:0,h2:0,l1:3,l2:3,k1:false,k2:false,t:1,darts:0,mult:1,over:false,botBusy:false};
 $('setup').classList.add('hidden');$('game').classList.remove('hidden');render();
 say(a+' begint. Kies Single, Double of Triple en daarna het geraakte nummer.');
}
function p(){return g.t===1?{own:g.n1,opp:g.n2,name:g.a,other:g.b,k:g.k1}:{own:g.n2,opp:g.n1,name:g.b,other:g.a,k:g.k2}}
function render(){
 $('name1').textContent=g.a;$('name2').textContent=g.b;$('num1').textContent=g.n1;$('num2').textContent=g.n2;
 $('s1').innerHTML=g.k1?'<span class="killer">🔥 KILLER</span>':'Nog geen Killer';$('s2').innerHTML=g.k2?'<span class="killer">🔥 KILLER</span>':'Nog geen Killer';
 $('h1').textContent='❤️'.repeat(g.l1)+'🖤'.repeat(3-g.l1);$('h2').textContent='❤️'.repeat(g.l2)+'🖤'.repeat(3-g.l2);
 $('pr1').textContent=Math.min(5,g.h1)+' / 5';$('pr2').textContent=Math.min(5,g.h2)+' / 5';
 $('bar1').style.width=(g.h1/5*100)+'%';$('bar2').style.width=(g.h2/5*100)+'%';
 $('c1').classList.toggle('active',g.t===1&&!g.over);$('c2').classList.toggle('active',g.t===2&&!g.over);
 $('turnbox').textContent=g.over?'🏆 Wedstrijd afgelopen':'🎯 AAN DE BEURT: '+p().name+' — '+(3-g.darts)+' pijlen over';
 $('dartnum').textContent=Math.min(3,g.darts+1);
 $('phase').textContent=(g.k1&&g.k2)?'🔥 Beide spelers zijn Killer — aanvalsfase':'Eerst Killer worden';
 $('rules').innerHTML=g.k1&&g.k2
 ? '<b>Aanval:</b> raak '+p().other+' op nummer <b>'+p().opp+'</b>. Raak je je eigen nummer, dan kun je je eigen levens terugbrengen (max. 3). Je kunt jezelf nooit KNOCKOUT gooien.'
 : '<b>Killer worden:</b> raak je eigen nummer <b>'+p().own+'</b>. De teller rekent over 5 heen terug: 4 + Double = 4, 4 + Triple = 3.';
 ['single','double','triple'].forEach((id,i)=>$(id).classList.toggle('selected',g.mult===i+1));
 $('dartrow').innerHTML=g.throws?g.throws.map((x,i)=>'<div class="dart"><b>Pijl '+(i+1)+'</b><br>'+x+'</div>').join(''):'';
 const grid=$('grid');grid.innerHTML='';
 for(let n=1;n<=20;n++){let b=document.createElement('button');b.textContent=n;
 if(g.t===1){if(n===g.n1)b.classList.add('my');if(n===g.n2)b.classList.add('opp')}else{if(n===g.n2)b.classList.add('my');if(n===g.n1)b.classList.add('opp')}
 b.onclick=()=>hit(n);grid.appendChild(b)}
}
function setMult(m){if(!g||g.over||g.botBusy)return;g.mult=m;render();say((m===1?'Single':m===2?'Double':'Triple')+' geselecteerd. Kies nu het nummer.')}
function say(s){$('msg').textContent=s}

function addWithBounce(current,points){
 let total=current+points;
 if(total<=5)return total;
 return 10-total;
}

function hit(n){
 if(!g||g.over||g.botBusy)return;
 const p0=p(),m=g.mult;
 g.darts++;
 let label=(m===1?'Single ':m===2?'Double ':'Triple ')+n;
 if(!p0.k){
   if(n===p0.own){
     if(g.t===1)g.h1=addWithBounce(g.h1,m);else g.h2=addWithBounce(g.h2,m);
     const h=g.t===1?g.h1:g.h2;
     if(h===5){if(g.t===1)g.k1=true;else g.k2=true;say('🔥 '+p0.name+' is KILLER!');}
     else say('🎯 '+label+' — Killer-teller is '+h+'/5.');
   }else say('❌ '+label+' — eigen nummer is '+p0.own+'.');
 }else{
   if(n===p0.opp){
     if(g.t===1)g.l2=Math.max(0,g.l2-m);else g.l1=Math.max(0,g.l1-m);
     const l=g.t===1?g.l2:g.l1;
     say('💥 '+label+'! '+p0.other+' verliest '+m+' leven'+(m>1?'s':'')+'. Nog '+l+'.');
     if(l<=0){g.over=true;$('throw').classList.add('hidden');$('win').classList.remove('hidden');$('winmsg').textContent='🏆 '+p0.name+' WINT — '+p0.other+' IS KNOCKOUT!';}
   }else if(n===p0.own){
     // Zelf raken: teller/levens gaat ook volgens dezelfde terugtelregel, maar nooit onder 1 leven.
     if(g.t===1)g.l1=Math.max(1,addWithBounce(g.l1,m));else g.l2=Math.max(1,addWithBounce(g.l2,m));
     say('❤️ '+label+' op je eigen nummer. Je kunt jezelf niet afgooien. Levens: '+(g.t===1?g.l1:g.l2)+'.');
   }else say('❌ '+label+' — '+p0.other+' heeft nummer '+p0.opp+'.');
 }
 if(g.over){render();return}
 if(g.darts===3){
   render();
   setTimeout(nextTurn,500);
 }else{
   g.mult=1;render();
 }
}
function nextTurn(){
 if(g.over)return;
 g.t=g.t===1?2:1;g.darts=0;g.mult=1;g.throws=[];
 render();say('Nieuwe beurt: '+p().name+'. 3 pijlen.');
 if(g.bot&&g.t===2)setTimeout(botTurn,650);
}
function botTurn(){
 if(g.over)return;g.botBusy=true;render();say('🤖 '+g.b+' is aan het gooien...');
 let i=0;
 function one(){
   if(g.over){g.botBusy=false;return}
   const p0=p();let n,m;
   if(!p0.k){
     n=Math.random()<0.78?g.n2:Math.floor(Math.random()*20)+1;
     m=Math.random()<0.15?3:(Math.random()<0.55?2:1);
   }else{
     if(g.l2<3&&Math.random()<0.65){n=g.n2;m=Math.random()<0.5?2:1}
     else {n=Math.random()<0.68?g.n1:Math.floor(Math.random()*20)+1;m=Math.random()<0.2?3:(Math.random()<0.55?2:1)}
   }
   g.mult=m;hit(n);
   if(!g.over&&g.darts<3)setTimeout(one,500);
   else g.botBusy=false;
 }
 one();
}
</script></body></html>
