<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Darts Knockout</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090e1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:700px;margin:auto;padding:15px 13px 40px}
h1{margin:5px 0;font-size:30px}
.sub{color:#aab6ca;margin-bottom:15px}
.card{background:#151e31;border:1px solid #2b3853;border-radius:20px;padding:15px;margin:12px 0}
.phase{color:#fbbf24;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h2{margin:6px 0 12px}
label{display:block;color:#aab6ca;font-size:13px;margin-bottom:4px}
input,select{width:100%;padding:12px;border-radius:12px;font-size:16px;background:#0d1424;color:#fff;border:1px solid #34425e}
button{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:900;background:#f59e0b;color:#111827;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.28;cursor:not-allowed}
.startButton{margin-top:12px}
.secondary{background:#29364f;color:#fff}
.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.playerSetup{background:#0d1424;border-radius:13px;padding:10px}
.turn{background:#f59e0b;color:#111827;border-radius:14px;padding:13px;text-align:center;font-size:19px;font-weight:950;margin:12px 0}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.player{background:#0d1424;border-radius:16px;padding:13px;border:2px solid transparent}
.player.active{border-color:#f59e0b}
.playerName{font-size:18px;font-weight:950}
.number{font-size:36px;font-weight:950;margin:2px 0 7px}
.counterLabel{color:#aab6ca;font-size:12px;text-transform:uppercase;font-weight:800}
.counter{font-size:30px;font-weight:950;margin:2px 0 6px}
.progress{height:10px;width:100%;background:#27334a;border-radius:20px;overflow:hidden}
.progressFill{height:100%;background:#f59e0b;width:0%;transition:width:.2s}
.killer{margin-top:9px;padding:9px;border-radius:10px;background:#14532d;color:#4ade80;font-weight:950;text-align:center}
.status{color:#aab6ca;font-size:12px;margin-top:8px}
.targetButtons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}
.targetButtons button{padding:11px 3px;font-size:10px}
.miss{border:2px solid #64748b!important;background:#475569!important;color:#fff!important}
.single{border:2px solid #22c55e}
.double{border:2px solid #f59e0b}
.triple{border:2px solid #ef4444}
.notice{background:#0d1424;padding:11px;border-radius:12px;margin-top:10px;line-height:1.4}
.throwResultTitle{margin-top:12px;color:#fbbf24;font-size:12px;font-weight:950;letter-spacing:.1em}
.throwResult{margin-top:5px;background:#27334a;border:2px solid #f59e0b;border-radius:14px;padding:14px;text-align:center;font-size:20px;font-weight:950;min-height:54px;display:flex;align-items:center;justify-content:center}
.message{min-height:22px}
.dartrow{display:flex;gap:6px;margin-top:10px}
.dart{flex:1;background:#0d1424;border:1px solid #34425e;border-radius:9px;padding:8px;text-align:center;font-size:11px}
.hidden{display:none!important}
.win{text-align:center;font-size:25px;font-weight:950}
.botTag{color:#aab6ca;font-size:12px}
@media(max-width:500px){
 .players{grid-template-columns:1fr}
 .setupgrid{grid-template-columns:1fr}
 .targetButtons button{font-size:10px}
}
</style>
</head>

<body>
<div class="app">

<h1>🎯 Darts Knockout</h1>
<div class="sub">3 pijlen per beurt • Miss • Single ×1 • Double ×2 • Triple ×3</div>

<section id="setup" class="card">
<div class="phase">Spel instellen</div>
<h2>Wie spelen er?</h2>

<select id="mode">
<option value="bot">🤖 BOT</option>
<option value="2">👥 2 spelers</option>
<option value="3">👥 3 spelers</option>
<option value="4">👥 4 spelers</option>
</select>

<div id="setupPlayers" class="setupgrid"></div>

<button id="startButton" class="startButton">Start wedstrijd 🎯</button>

<div class="notice">
Je moet precies 5 halen om Killer te worden. Ga je over 5, dan telt je score terug vanaf 5.
</div>
</section>

<section id="game" class="hidden">

<div id="turn" class="turn"></div>

<div class="card">
<div id="phase" class="phase"></div>
<div id="players" class="players"></div>
</div>

<div id="throwCard" class="card">
<div id="darts" class="dartrow"></div>
<div class="throwResultTitle">LAATSTE WORP</div>
<div id="message" class="throwResult">Nog geen worp</div>
</div>

<div id="win" class="card hidden">
<div id="winMessage" class="win"></div>
<button id="newGame" class="secondary">Nieuwe wedstrijd</button>
<button id="mainMenu" class="secondary" style="margin-top:8px">Hoofdmenu</button>
</div>

</section>
</div>

<script>
"use strict";

let game=null;

const setup=document.getElementById("setup");
const gameScreen=document.getElementById("game");
const mode=document.getElementById("mode");
const setupPlayers=document.getElementById("setupPlayers");
const startButton=document.getElementById("startButton");
const turnBox=document.getElementById("turn");
const phaseBox=document.getElementById("phase");
const playersBox=document.getElementById("players");
const dartsBox=document.getElementById("darts");
const message=document.getElementById("message");
const throwCard=document.getElementById("throwCard");
const winBox=document.getElementById("win");
const winMessage=document.getElementById("winMessage");
const newGame=document.getElementById("newGame");
const mainMenu=document.getElementById("mainMenu");

function drawSetup(){
  const selected=mode.value;
  setupPlayers.innerHTML="";

  if(selected==="bot"){
    setupPlayers.innerHTML=
      '<div class="playerSetup">'+
      '<label>Jouw naam</label>'+
      '<input id="name0" value="Speler 1">'+
      '<label style="margin-top:8px">Jouw nummer</label>'+
      '<input id="num0" type="number" min="1" max="20" placeholder="1-20">'+
      '</div>';
    return;
  }

  const amount=Number(selected);

  for(let i=0;i<amount;i++){
    const box=document.createElement("div");
    box.className="playerSetup";
    box.innerHTML=
      '<label>Speler '+(i+1)+'</label>'+
      '<input id="name'+i+'" value="Speler '+(i+1)+'">'+
      '<label style="margin-top:8px">Nummer</label>'+
      '<input id="num'+i+'" type="number" min="1" max="20" placeholder="1-20">';
    setupPlayers.appendChild(box);
  }
}

mode.addEventListener("change",drawSetup);
drawSetup();

function randomFreeNumber(used){
  const free=[];
  for(let n=1;n<=20;n++){
    if(!used.includes(n)) free.push(n);
  }
  return free[Math.floor(Math.random()*free.length)];
}

startButton.addEventListener("click",startGame);

function startGame(){
  const selected=mode.value;
  const players=[];

  const firstName=(document.getElementById("name0")?.value.trim())||"Speler 1";
  const firstNumber=Number(document.getElementById("num0")?.value);

  if(firstNumber<1||firstNumber>20){
    alert("Kies voor iedere speler een nummer van 1 t/m 20.");
    return;
  }

  players.push({
    name:firstName,
    number:firstNumber,
    counter:0,
    killer:false,
    lives:3,
    darts:[],
    bot:false
  });

  if(selected==="bot"){
    players.push({
      name:"BOT",
      number:randomFreeNumber([firstNumber]),
      counter:0,
      killer:false,
      lives:3,
      darts:[],
      bot:true
    });
  }else{
    const amount=Number(selected);

    for(let i=1;i<amount;i++){
      const playerName=(document.getElementById("name"+i)?.value.trim())||"Speler "+(i+1);
      const playerNumber=Number(document.getElementById("num"+i)?.value);

      if(playerNumber<1||playerNumber>20){
        alert("Kies voor iedere speler een nummer van 1 t/m 20.");
        return;
      }

      players.push({
        name:playerName,
        number:playerNumber,
        counter:0,
        killer:false,
        lives:3,
        darts:[],
        bot:false
      });
    }
  }

  const numbers=players.map(p=>p.number);

  if(new Set(numbers).size!==numbers.length){
    alert("Iedere speler moet een verschillend nummer hebben.");
    return;
  }

  game={
    players:players,
    current:0,
    dart:0,
    finished:false,
    botMode:selected==="bot"
  };

  setup.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  render();
  setMessage(players[0].name+" begint. Gooi op je eigen nummer.");
}

function currentPlayer(){
  return game.players[game.current];
}

function setMessage(text){
  message.textContent=text;
}

function applyOwnThrow(player,value){
  const total=player.counter+value;

  if(total<=5){
    return {score:total,bust:false,killer:total===5};
  }

  return {
    score:10-total,
    bust:true,
    killer:false
  };
}

function render(){
  if(!game)return;

  const current=currentPlayer();

  turnBox.textContent="🎯 "+current.name+" — "+(3-game.dart)+" pijlen over";
  phaseBox.textContent=current.killer?"AANVALSFASE":"OPBOUWFASE";

  playersBox.innerHTML="";

  game.players.forEach((player,index)=>{
    const card=document.createElement("div");
    card.className="player";

    if(index===game.current) card.classList.add("active");

    const title=document.createElement("div");
    title.className="playerName";
    title.textContent=player.name;

    if(player.killer){
      const flame=document.createElement("span");
      flame.textContent=" 🔥";
      title.appendChild(flame);
    }

    if(player.bot){
      const tag=document.createElement("span");
      tag.className="botTag";
      tag.textContent=" 🤖";
      title.appendChild(tag);
    }

    const number=document.createElement("div");
    number.className="number";
    number.textContent="🎯 "+player.number;

    const label=document.createElement("div");
    label.className="counterLabel";
    label.textContent="Teller";

    const counter=document.createElement("div");
    counter.className="counter";
    counter.textContent=player.counter+" / 5";

    card.appendChild(title);
    card.appendChild(number);
    card.appendChild(label);
    card.appendChild(counter);

    const progress=document.createElement("div");
    progress.className="progress";

    const fill=document.createElement("div");
    fill.className="progressFill";
    fill.style.width=(player.counter/5*100)+"%";

    progress.appendChild(fill);
    card.appendChild(progress);

    const status=document.createElement("div");
    status.className="status";

    if(player.bot){
      status.textContent=player.killer
        ?"BOT • Aanvalsteller "+player.counter+" / 5"
        :"BOT speelt automatisch";
    }else if(!current.killer){
      status.textContent=index===game.current
        ?"Dit is jouw nummer."
        :"Wacht op je beurt.";
    }else{
      if(index===game.current){
        status.textContent="Je kunt jezelf niet aanvallen.";
      }else if(player.killer){
        status.textContent="Aanvalsteller "+player.counter+" / 5";
      }else{
        status.textContent="Teller: "+player.counter+" / 5";
      }
    }

    card.appendChild(status);

    // Als de BOT aan het opbouwen is naar 5, krijgt hij geen knoppen.
    // Als JIJ Killer bent, komen de aanvalsknoppen juist ook bij de BOT tevoorschijn.
    // Zo kun je bij de BOT MISS / Single / Double / Triple kiezen.
    const showButtons =
      !game.finished &&
      game.dart<3 &&
      !current.bot &&
      (
        (!current.killer && index===game.current) ||
        (current.killer && index!==game.current)
      );

    if(showButtons){
      const buttons=document.createElement("div");
      buttons.className="targetButtons";

      buttons.appendChild(makeButton("MISS","miss",index,0,true));
      buttons.appendChild(makeButton("SINGLE ×1","single",index,1,true));
      buttons.appendChild(makeButton("DOUBLE ×2","double",index,2,true));
      buttons.appendChild(makeButton("TRIPLE ×3","triple",index,3,true));

      card.appendChild(buttons);
    }

    playersBox.appendChild(card);
  });

  dartsBox.innerHTML="";

  current.darts.forEach((item,index)=>{
    const dart=document.createElement("div");
    dart.className="dart";
    dart.innerHTML="<b>Pijl "+(index+1)+"</b><br>"+item;
    dartsBox.appendChild(dart);
  });
}

function makeButton(text,css,index,multiplier,enabled){
  const button=document.createElement("button");
  button.textContent=text;
  button.className=css;
  button.disabled=!enabled;

  button.addEventListener("click",function(){
    throwDart(index,multiplier);
  });

  return button;
}

function throwDart(targetIndex,multiplier){
  if(!game||game.finished||game.dart>=3)return;

  const attacker=currentPlayer();
  const target=game.players[targetIndex];

  if(!attacker.killer&&targetIndex!==game.current)return;
  if(attacker.killer&&targetIndex===game.current)return;

  game.dart++;

  const type=multiplier===0?"MISS":multiplier===1?"Single":multiplier===2?"Double":"Triple";

  attacker.darts.push(type+" → "+target.name);

  if(multiplier===0){
    setMessage("❌ "+attacker.name+" mist — 0 punten.");
  }else if(!attacker.killer){
    const result=applyOwnThrow(attacker,multiplier);
    attacker.counter=result.score;

    if(result.killer){
      attacker.killer=true;
      setMessage("🔥 "+attacker.name+" heeft precies 5 / 5 gehaald! 🔥");
    }else if(result.bust){
      setMessage(type+" was te veel → terug naar "+attacker.counter+" / 5.");
    }else{
      setMessage(type+" → "+attacker.counter+" / 5");
    }
  }else{
    if(!target.killer){
      target.counter=Math.max(0,target.counter-multiplier);
      setMessage("💥 "+type+" op "+target.name+" → "+target.counter+" / 5");
    }else{
      // Een Killer wordt aangevallen via zijn 5/5-teller.
      // Bijvoorbeeld: 5/5 - Triple = 2/5.
      const before=target.counter;
      const after=before-multiplier;

      if(after===0){
        target.counter=0;
        target.killer=false;
        game.finished=true;
        throwCard.classList.add("hidden");
        winBox.classList.remove("hidden");
        winMessage.textContent="🏆 "+attacker.name+" WINT!";
        render();
        return;
      }

      if(after<0){
        // Te veel schade: terugkaatsen vanaf 0.
        // Zodra de teller onder 5 komt, is de aanvalsfase DIRECT voorbij.
        target.counter=Math.abs(after);
        target.killer=false;
        setMessage("💥 "+type+" was te veel → "+target.name+" terug naar "+target.counter+" / 5. Opnieuw opbouwen!");
      }else{
        target.counter=after;
        target.killer=false;
        setMessage("💥 "+type+" op "+target.name+" → "+target.counter+" / 5. Opnieuw opbouwen!");
      }
    }
  }

  render();

  if(game.dart===3){
    // Geef de speler even tijd om de laatste worp te zien.
    setTimeout(nextTurn,2200);
  }
}

function nextTurn(){
  if(!game||game.finished)return;

  game.current=(game.current+1)%game.players.length;
  game.dart=0;
  game.players[game.current].darts=[];

  render();
  setMessage(currentPlayer().name+" is aan de beurt. 3 pijlen.");

  if(game.botMode&&currentPlayer().bot){
    setTimeout(botTurn,800);
  }
}

function botTurn(){
  if(!game||game.finished||!currentPlayer().bot)return;

  if(game.dart>=3){
    nextTurn();
    return;
  }

  const bot=currentPlayer();
  let targetIndex=game.current;
  let value;

  if(Math.random()<0.22){
    value=0;
  }else if(!bot.killer){
    const needed=5-bot.counter;

    if(needed>=1&&needed<=3&&Math.random()<0.55){
      value=needed;
    }else{
      value=1+Math.floor(Math.random()*3);
    }

    targetIndex=game.current;
  }else{
    const humanIndex=game.players.findIndex(p=>!p.bot);
    targetIndex=humanIndex;

    const target=game.players[targetIndex];

    if(target.killer){
      if(target.lives===1){
        value=Math.random()<0.65?1:2;
      }else if(target.lives===2){
        value=Math.random()<0.65?2:1;
      }else{
        value=Math.random()<0.55?2:1;
      }
    }else{
      value=target.counter>=3&&Math.random()<0.55?3:1+Math.floor(Math.random()*3);
    }
  }

  throwDart(targetIndex,value);

  if(!game.finished&&game.current===game.players.findIndex(p=>p.bot)&&game.dart<3){
    setTimeout(botTurn,850);
  }
}

newGame.addEventListener("click",function(){
  location.reload();
});

mainMenu.addEventListener("click",function(){
  game=null;
  winBox.classList.add("hidden");
  throwCard.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  setup.classList.remove("hidden");
  drawSetup();
});
</script>
</body>
</html>
