<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#090e1a">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">

<title>Darts Knockout</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090e1a;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  max-width:700px;
  margin:auto;
  padding:15px 13px 40px;
}

h1{
  margin:5px 0;
  font-size:30px;
}

.sub{
  color:#aab6ca;
  margin-bottom:15px;
}

.card{
  background:#151e31;
  border:1px solid #2b3853;
  border-radius:20px;
  padding:15px;
  margin:12px 0;
}

.phase{
  color:#fbbf24;
  font-weight:900;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h2{
  margin:6px 0 12px;
}

label{
  display:block;
  color:#aab6ca;
  font-size:13px;
  margin-bottom:4px;
}

input,
select{
  width:100%;
  padding:12px;
  border-radius:12px;
  font-size:16px;
  background:#0d1424;
  color:white;
  border:1px solid #34425e;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  background:#f59e0b;
  color:#111827;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.3;
  cursor:not-allowed;
}

.startButton{
  margin-top:12px;
}

.secondary{
  background:#29364f;
  color:white;
}

.setupgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.playerSetup{
  background:#0d1424;
  border-radius:13px;
  padding:10px;
}

.turn{
  background:#f59e0b;
  color:#111827;
  border-radius:14px;
  padding:13px;
  text-align:center;
  font-size:19px;
  font-weight:950;
  margin:12px 0;
}

.players{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.player{
  background:#0d1424;
  border-radius:16px;
  padding:13px;
  border:2px solid transparent;
}

.player.active{
  border-color:#f59e0b;
}

.playerName{
  font-size:18px;
  font-weight:950;
}

.number{
  font-size:36px;
  font-weight:950;
  margin:2px 0 7px;
}

.counterLabel{
  color:#aab6ca;
  font-size:12px;
  text-transform:uppercase;
  font-weight:800;
}

.counter{
  font-size:30px;
  font-weight:950;
  margin:2px 0 6px;
}

.progress{
  height:10px;
  width:100%;
  background:#27334a;
  border-radius:20px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  background:#f59e0b;
  width:0%;
  transition:width:.2s;
}

.killer{
  margin-top:9px;
  padding:9px;
  border-radius:10px;
  background:#14532d;
  color:#4ade80;
  font-weight:950;
  text-align:center;
}

.status{
  color:#aab6ca;
  font-size:12px;
  margin-top:8px;
}

.targetButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:11px;
}

.targetButtons button{
  padding:11px 4px;
  font-size:11px;
}

.single{
  border:2px solid #22c55e;
}

.double{
  border:2px solid #f59e0b;
}

.triple{
  border:2px solid #ef4444;
}

.notice{
  background:#0d1424;
  padding:11px;
  border-radius:12px;
  margin-top:10px;
  line-height:1.4;
}

.message{
  min-height:22px;
}

.dartrow{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.dart{
  flex:1;
  background:#0d1424;
  border:1px solid #34425e;
  border-radius:9px;
  padding:8px;
  text-align:center;
  font-size:11px;
}

.hidden{
  display:none!important;
}

.win{
  text-align:center;
  font-size:25px;
  font-weight:950;
}

@media(max-width:500px){

  .players{
    grid-template-columns:1fr;
  }

  .setupgrid{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<div class="app">

<h1>🎯 Darts Knockout</h1>

<div class="sub">
3 pijlen per beurt • Single ×1 • Double ×2 • Triple ×3
</div>


<!-- SETUP -->

<section id="setup" class="card">

<div class="phase">
Spel instellen
</div>

<h2>
Hoeveel spelers?
</h2>

<select id="count">
<option value="2">2 spelers</option>
<option value="3">3 spelers</option>
<option value="4">4 spelers</option>
</select>

<div id="setupPlayers" class="setupgrid"></div>

<button id="startButton" class="startButton">
Start wedstrijd 🎯
</button>

<div class="notice">
Iedere speler krijgt een eigen nummer van 1 t/m 20.
Tijdens het gooien zijn er geen nummerknoppen en geen popups.
</div>

</section>


<!-- GAME -->

<section id="game" class="hidden">

<div id="turn" class="turn"></div>


<div class="card">

<div id="phase" class="phase"></div>

<div id="players" class="players"></div>

</div>


<div id="throwCard" class="card">

<div class="phase">
Pijl <span id="dartNo">1</span> van 3
</div>

<div id="rules" class="notice"></div>

<div id="darts" class="dartrow"></div>

<div id="message" class="notice message"></div>

</div>


<div id="win" class="card hidden">

<div id="winMessage" class="win"></div>

<button id="newGame" class="secondary">
Nieuwe wedstrijd
</button>

</div>

</section>

</div>


<script>

/* =========================
   SPEL DATA
========================= */

let game=null;


/* =========================
   ELEMENTEN
========================= */

const setup=document.getElementById("setup");
const gameScreen=document.getElementById("game");

const count=document.getElementById("count");
const setupPlayers=document.getElementById("setupPlayers");

const startButton=document.getElementById("startButton");

const playersBox=document.getElementById("players");

const turnBox=document.getElementById("turn");
const phaseBox=document.getElementById("phase");

const dartNo=document.getElementById("dartNo");

const rules=document.getElementById("rules");
const dartsBox=document.getElementById("darts");
const message=document.getElementById("message");

const throwCard=document.getElementById("throwCard");

const winBox=document.getElementById("win");
const winMessage=document.getElementById("winMessage");

const newGame=document.getElementById("newGame");


/* =========================
   SETUP TEKENEN
========================= */

function drawSetup(){

  const amount=Number(count.value);

  setupPlayers.innerHTML="";

  for(let i=0;i<amount;i++){

    const box=document.createElement("div");

    box.className="playerSetup";

    box.innerHTML=`

      <label>
        Speler ${i+1}
      </label>

      <input
        id="name${i}"
        value="Speler ${i+1}"
      >

      <label style="margin-top:8px">
        Nummer
      </label>

      <input
        id="num${i}"
        type="number"
        min="1"
        max="20"
        placeholder="1-20"
      >

    `;

    setupPlayers.appendChild(box);
  }
}


/* =========================
   SETUP EVENTS
========================= */

count.addEventListener("change",drawSetup);

drawSetup();


/* =========================
   START
========================= */

startButton.addEventListener("click",startGame);


function startGame(){

  const amount=Number(count.value);

  const players=[];

  for(let i=0;i<amount;i++){

    const nameInput=document.getElementById("name"+i);
    const numInput=document.getElementById("num"+i);

    const name=
      nameInput.value.trim() ||
      "Speler "+(i+1);

    const number=
      Number(numInput.value);

    if(number<1 || number>20){

      alert(
        "Kies voor iedere speler een nummer van 1 t/m 20."
      );

      return;
    }

    players.push({

      name:name,

      number:number,

      counter:0,

      killer:false,

      lives:3,

      darts:[]

    });

  }


  const numbers=
    players.map(player=>player.number);

  const unique=
    new Set(numbers);


  if(unique.size!==players.length){

    alert(
      "Iedere speler moet een verschillend nummer hebben."
    );

    return;
  }


  game={

    players:players,

    current:0,

    dart:0,

    finished:false

  };


  setup.classList.add("hidden");

  gameScreen.classList.remove("hidden");

  render();

  setMessage(
    players[0].name+" begint. Gooi op je eigen nummer."
  );

}


/* =========================
   HUIDIGE SPELER
========================= */

function currentPlayer(){

  return game.players[game.current];

}


/* =========================
   BERICHT
========================= */

function setMessage(text){

  message.textContent=text;

}


/* =========================
   RENDER
========================= */

function render(){

  if(!game){
    return;
  }


  const current=currentPlayer();


  turnBox.textContent=
    "🎯 "+
    current.name+
    " — "+
    (3-game.dart)+
    " pijlen over";


  dartNo.textContent=
    Math.min(game.dart+1,3);


  phaseBox.textContent=
    current.killer
    ? "🔥 KILLER — AANVALSFASE"
    : "EERST 5 PUNTEN HALEN";


  playersBox.innerHTML="";


  game.players.forEach((player,index)=>{

    const card=document.createElement("div");

    card.className="player";

    if(index===game.current){

      card.classList.add("active");

    }


    const title=
      document.createElement("div");

    title.className="playerName";

    title.textContent=player.name;


    const number=
      document.createElement("div");

    number.className="number";

    number.textContent=
      "🎯 "+player.number;


    const counterLabel=
      document.createElement("div");

    counterLabel.className="counterLabel";

    counterLabel.textContent=
      player.killer
      ? "Status"
      : "Killer-teller";


    const counter=
      document.createElement("div");

    counter.className="counter";

    counter.textContent=
      player.killer
      ? "KILLER 🔥"
      : player.counter+" / 5";


    card.appendChild(title);
    card.appendChild(number);
    card.appendChild(counterLabel);
    card.appendChild(counter);


    if(!player.killer){

      const progress=
        document.createElement("div");

      progress.className="progress";


      const fill=
        document.createElement("div");

      fill.className="progressFill";

      fill.style.width=
        (player.counter/5*100)+"%";


      progress.appendChild(fill);

      card.appendChild(progress);

    }else{

      const killer=
        document.createElement("div");

      killer.className="killer";

      killer.textContent=
        "🔥 KILLER";

      card.appendChild(killer);

    }


    const status=
      document.createElement("div");

    status.className="status";


    if(!current.killer){

      if(index===game.current){

        status.textContent=
          "Dit is jouw nummer.";

      }else{

        status.textContent=
          "Nog niet beschikbaar.";

      }

    }else{

      if(index===game.current){

        status.textContent=
          "Je kunt jezelf niet aanvallen.";

      }else if(player.killer){

        status.textContent=
          "Killer • "+player.lives+" levens";

      }else{

        status.textContent=
          "Aanvalteller: "+player.counter+" / 5";

      }

    }


    card.appendChild(status);


    /* BUTTONS */

    const buttons=
      document.createElement("div");

    buttons.className="targetButtons";


    const single=
      createThrowButton(
        "SINGLE ×1",
        "single",
        index,
        1
      );

    const double=
      createThrowButton(
        "DOUBLE ×2",
        "double",
        index,
        2
      );

    const triple=
      createThrowButton(
        "TRIPLE ×3",
        "triple",
        index,
        3
      );


    buttons.appendChild(single);
    buttons.appendChild(double);
    buttons.appendChild(triple);

    card.appendChild(buttons);

    playersBox.appendChild(card);

  });


  /* REGELS */

  if(!current.killer){

    rules.innerHTML=
      "<b>Word Killer:</b><br>"+
      "Gooi op je eigen nummer. "+
      "Single = +1, Double = +2, Triple = +3. "+
      "Bij precies 5 / 5 word je Killer 🔥.";

  }else{

    rules.innerHTML=
      "<b>Je bent Killer:</b><br>"+
      "Val een andere speler aan. "+
      "Single = 1 schade, Double = 2 schade, Triple = 3 schade.";

  }


  /* PIJLEN */

  dartsBox.innerHTML="";

  current.darts.forEach((throwText,index)=>{

    const dart=
      document.createElement("div");

    dart.className="dart";

    dart.innerHTML=
      "<b>Pijl "+(index+1)+"</b><br>"+
      throwText;

    dartsBox.appendChild(dart);

  });

}


/* =========================
   BUTTON MAKEN
========================= */

function createThrowButton(
  text,
  cssClass,
  targetIndex,
  multiplier
){

  const button=
    document.createElement("button");

  button.textContent=text;

  button.className=cssClass;


  let allowed=false;


  if(!game.finished && game.dart<3){

    if(!currentPlayer().killer){

      /* Voor Killer alleen eigen speler */

      allowed=
        targetIndex===game.current;

    }else{

      /* Killer mag andere spelers aanvallen */

      allowed=
        targetIndex!==game.current;

    }

  }


  button.disabled=!allowed;


  /*
    BELANGRIJK:
    De klik wordt rechtstreeks aan de button gekoppeld.
  */

  button.addEventListener(
    "click",
    function(){

      throwDart(
        targetIndex,
        multiplier
      );

    }
  );


  return button;

}


/* =========================
   PIJL GOOIEN
========================= */

function throwDart(
  targetIndex,
  multiplier
){

  if(
    !game ||
    game.finished ||
    game.dart>=3
  ){

    return;

  }


  const attacker=
    currentPlayer();

  const target=
    game.players[targetIndex];


  /* CONTROLE */

  if(!attacker.killer){

    if(targetIndex!==game.current){

      return;

    }

  }else{

    if(targetIndex===game.current){

      return;

    }

  }


  game.dart++;


  const type=
    multiplier===1
    ? "Single"
    : multiplier===2
    ? "Double"
    : "Triple";


  attacker.darts.push(
    type+
    " → "+
    target.name
  );


  /* =====================
     GEEN KILLER
  ===================== */

  if(!attacker.killer){

    attacker.counter+=multiplier;


    /*
      Nooit boven 5.
    */

    if(attacker.counter>5){

      attacker.counter=5;

    }


    if(attacker.counter===5){

      attacker.killer=true;

      setMessage(
        "🔥 "+
        attacker.name+
        " is KILLER!"
      );

    }else{

      setMessage(
        type+
        " → "+
        attacker.counter+
        " / 5"
      );

    }

  }


  /* =====================
     KILLER
  ===================== */

  else{

    if(!target.killer){

      /*
        Aanvallen verlaagt
        de teller.
      */

      target.counter=
        Math.max(
          0,
          target.counter-multiplier
        );


      setMessage(
        "💥 "+
        type+
        " op "+
        target.name+
        " → "+
        target.counter+
        " / 5"
      );

    }else{

      /*
        Killer aanvallen:
        levens verminderen.
      */

      target.lives=
        Math.max(
          0,
          target.lives-multiplier
        );


      setMessage(
        "💥 "+
        type+
        " op "+
        target.name+
        " → "+
        target.lives+
        " levens"
      );


      if(target.lives===0){

        game.finished=true;

        throwCard.classList.add("hidden");

        winBox.classList.remove("hidden");

        winMessage.textContent=
          "🏆 "+
          attacker.name+
          " WINT!";

        render();

        return;

      }

    }

  }


  render();


  /* =====================
     NA 3 PIJLEN
  ===================== */

  if(game.dart===3){

    setTimeout(
      nextTurn,
      500
    );

  }

}


/* =========================
   VOLGENDE BEURT
========================= */

function nextTurn(){

  if(
    !game ||
    game.finished
  ){

    return;

  }


  game.current=
    (game.current+1)%
    game.players.length;


  game.dart=0;


  game.players[
    game.current
  ].darts=[];


  render();


  setMessage(
    currentPlayer().name+
    " is aan de beurt. 3 pijlen."
  );

}


/* =========================
   NIEUW SPEL
========================= */

newGame.addEventListener(
  "click",
  function(){

    location.reload();

  }
);

</script>

</body>
</html>
