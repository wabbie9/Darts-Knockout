
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Darts Knockout</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:600px;margin:auto;padding:16px 14px 32px}
h1{margin:5px 0;font-size:30px}.sub{color:#aab6ca;margin-bottom:15px}
.card{background:#151e31;border:1px solid #2b3853;border-radius:20px;padding:16px;margin:12px 0}
h2{margin:0 0 12px}.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;color:#aab6ca;font-size:13px;margin-bottom:5px}
input,select,button{width:100%;padding:13px;border-radius:13px;font-size:16px}
input,select{background:#0d1424;color:#fff;border:1px solid #34425e}
button{border:0;background:#f59e0b;color:#111827;font-weight:900;margin-top:10px}
button.secondary{background:#29364f;color:#fff}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:#0d1424;border-radius:15px;padding:12px}
.active{outline:3px solid #f59e0b}
.name{font-size:17px;font-weight:900}.number{font-size:38px;font-weight:950}
.muted,.small{color:#aab6ca}.status{font-size:13px}.killer{color:#4ade80;font-weight:900}
.hearts{font-size:21px;margin:4px 0}.progress{height:8px;background:#27334a;border-radius:20px;overflow:hidden}
.fill{height:100%;background:#f59e0b;transition:width .2s}
.turnbox{text-align:center;background:#f59e0b;color:#111827;border-radius:15px;padding:12px;margin:10px 0;font-size:21px;font-weight:950}
.phase{color:#fbbf24;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.notice{background:#0d1424;padding:12px;border-radius:13px;margin-top:10px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.grid button{margin:0;background:#202c44;color:#fff;padding:12px 4px}
.my{outline:2px solid #22c55e}.opp{outline:2px solid #ef4444}
.hidden{display:none}.win{text-align:center;font-size:27px;font-weight:950}
.darts{font-size:17px;font-weight:800;margin-top:8px}.dartrow{display:flex;gap:7px;margin-top:8px}
.dart{flex:1;background:#0d1424;border:1px solid #34425e;border-radius:10px;padding:8px;text-align:center;font-size:13px}
.good{color:#4ade80}.bad{color:#f87171}
</style>
</head>
<body>
<div class="app">
<h1>🎯 Darts Knockout</h1>
<div class="sub">3 pijlen per beurt • dubbel = 2 • triple = 3</div>

<section id="setup" class="card">
<div class="phase">Spel instellen</div>
<h2>Wie spelen er?</h2>
<div class="row">
<div><label>Speler 1</label><input id="p1" value="Speler 1"></div>
<div><label>Speler 2</label><input id="p2" value="Tegenstander"></div>
</div>
<label style="margin-top:10px">Tegenstander</label>
<select id="mode"><option value="human">👤 Echte tegenspeler</option><option value="bot">🤖 Bot</option></select>
<h2 style="margin-top:18px">Kies jullie nummers</h2>
<div class="row">
<div><label>Nummer speler 1</label><input id="n1" type="number" min="1" max="20"></div>
<div><label>Nummer speler 2</label><input id="n2" type="number" min="1" max="20"></div>
</div>
<button onclick="start()">Start wedstrijd 🎯</button>
</section>

<section id="game" class="hidden">
<div class="turnbox" id="turnbox"></div>

<div class="card">
<div class="phase" id="phase"></div>
<div class="players">
<div class="player" id="c1">
<div class="name" id="name1"></div><div class="small">Eigen nummer</div>
<div class="number" id="num1"></div><div id="s1" class="status"></div>
<div id="h1" class="hearts"></div>
<div class="small">Killer: <span id="pr1"></span></div>
<div class="progress"><div id="bar1" class="fill"></div></div>
</div>
<div class="player" id="c2">
<div class="name" id="name2"></div><div class="small">Eigen nummer</div>
<div class="number" id="num2"></div><div id="s2" class="status"></div>
<div id="h2" class="hearts"></div>
<div class="small">Killer: <span id="pr2"></span></div>
<div class="progress"><div id="bar2" class="fill"></div></div>
</div>
</div>
</div>

<div id="throw" class="card">
<div class="phase">Jouw 3 pijlen</div>
<div class="notice" id="rules"></div>
<div class="dartrow" id="dartrow"></div>
<div class="grid" id="grid"></div>
<div class="notice" id="msg"></div>
<button class="secondary" onclick="endTurn()" id="endbtn">Beurt afsluiten</button>
</div>

<div id="win" class="card hidden">
<div class="win" id="winmsg"></div>
<button class="secondary" onclick="location.reload()">Nieuwe wedstrijd</button>
</div>
</section>
</div>

<script>
let g=null;
const $=id=>document.getElementById(id);

function start(){
 const a=$('p1').value.trim()||'Speler 1';
 const b=$('p2').value.trim()||'Speler 2';
 const n1=+$('n1').value, n2=+$('n2').value;
 if(n1<1||n1>20||n2<1||n2>20||n1===n2){
   alert('Kies twee verschillende nummers van 1 t/m 20.'); return;
 }
 g={
   a,b,n1,n2,bot:$('mode').value==='bot',
   h1:0,h2:0,l1:3,l2:3,k1:false,k2:false,
   t:1,dartsLeft:3,throws:[],over:false,botBusy:false
 };
 $('setup').classList.add('hidden');
 $('game').classList.remove('hidden');
 render();
 say(a+' begint. Je hebt 3 pijlen. Raak je eigen nummer 5 keer.');
}

function current(){
 return g.t===1 ? {
   own:g.n1,opp:g.n2,name:g.a,other:g.b,k:g.k1
 } : {
   own:g.n2,opp:g.n1,name:g.b,other:g.a,k:g.k2
 };
}

function render(){
 $('name1').textContent=g.a; $('name2').textContent=g.b;
 $('num1').textContent=g.n1; $('num2').textContent=g.n2;
 $('s1').innerHTML=g.k1?'<span class="killer">🔥 KILLER</span>':'Nog geen Killer';
 $('s2').innerHTML=g.k2?'<span class="killer">🔥 KILLER</span>':'Nog geen Killer';
 $('h1').textContent='❤️'.repeat(g.l1)+'🖤'.repeat(3-g.l1);
 $('h2').textContent='❤️'.repeat(g.l2)+'🖤'.repeat(3-g.l2);
 $('pr1').textContent=Math.min(5,g.h1)+' / 5';
 $('pr2').textContent=Math.min(5,g.h2)+' / 5';
 $('bar1').style.width=Math.min(100,g.h1/5*100)+'%';
 $('bar2').style.width=Math.min(100,g.h2/5*100)+'%';

 $('c1').classList.toggle('active',g.t===1&&!g.over);
 $('c2').classList.toggle('active',g.t===2&&!g.over);

 const p=current();
 $('turnbox').textContent=g.over?'🏆 Wedstrijd afgelopen':'🎯 AAN DE BEURT: '+p.name+' — '+g.dartsLeft+' pijl'+(g.dartsLeft===1?'':'en')+' over';

 $('phase').textContent=(g.k1&&g.k2)?'🔥 Beide spelers zijn Killer — aanvalsfase':'Eerst Killer worden';
 $('rules').innerHTML=g.k1&&g.k2
   ? '<b>Attack:</b> raak <b>'+p.other+'</b> op nummer '+p.opp+'. Raak je eigen nummer, dan kun je je eigen levens weer aanvullen (max. 3).'
   : '<b>Killer worden:</b> raak je eigen nummer <b>'+p.own+'</b>. Single = 1, dubbel = 2, triple = 3. Je teller stopt bij 5.';

 $('dartrow').innerHTML='';
 for(let i=0;i<3;i++){
   const d=document.createElement('div'); d.className='dart';
   d.innerHTML='<b>Pijl '+(i+1)+'</b><br>'+(g.throws[i]||'—');
   $('dartrow').appendChild(d);
 }
 $('endbtn').disabled=g.dartsLeft===3||g.over;

 const grid=$('grid');grid.innerHTML='';
 for(let n=1;n<=20;n++){
   const b=document.createElement('button'); b.textContent=n;
   if(g.t===1){if(n===g.n1)b.classList.add('my');if(n===g.n2)b.classList.add('opp')}
   else {if(n===g.n2)b.classList.add('my');if(n===g.n1)b.classList.add('opp')}
   b.onclick=()=>chooseHit(n);
   grid.appendChild(b);
 }
}

function say(text){$('msg').textContent=text}

function chooseHit(n){
 if(g.over||g.dartsLeft<=0||g.botBusy)return;
 const p=current();
 const multiplier=askMultiplier(n,p);
 if(multiplier===null)return;

 let label='Single '+n;
 if(multiplier===2)label='Double '+n;
 if(multiplier===3)label='Triple '+n;
 g.throws.push(label);
 g.dartsLeft--;

 if(!p.k){
   if(n===p.own){
     if(g.t===1)g.h1=Math.min(5,g.h1+multiplier);
     else g.h2=Math.min(5,g.h2+multiplier);
     const hits=g.t===1?g.h1:g.h2;
     if(hits>=5){
       if(g.t===1)g.k1=true; else g.k2=true;
       say('🔥 '+p.name+' is KILLER! ('+hits+'/5)');
     }else{
       say('🎯 '+label+' op je eigen nummer. '+hits+'/5');
     }
   }else{
     say('❌ '+label+' — niet je eigen nummer '+p.own+'.');
   }
 }else{
   if(n===p.opp){
     if(g.t===1)g.l2=Math.max(0,g.l2-multiplier);
     else g.l1=Math.max(0,g.l1-multiplier);
     const lives=g.t===1?g.l2:g.l1;
     say('💥 '+label+'! '+p.other+' verliest '+multiplier+' leven'+(multiplier>1?'s':'')+'. Nog '+lives+'.');
     if(lives<=0){
       g.over=true;
       $('throw').classList.add('hidden');
       $('win').classList.remove('hidden');
       $('winmsg').textContent='🏆 '+p.name+' WINT — '+p.other+' IS KNOCKOUT!';
     }
   }else if(n===p.own){
     // Je kunt jezelf nooit beschadigen. Een treffer op je eigen nummer herstelt juist levens.
     if(g.t===1)g.l1=Math.min(3,g.l1+multiplier);
     else g.l2=Math.min(3,g.l2+multiplier);
     say('❤️ '+label+' op je eigen nummer. '+p.name+' kan zichzelf niet afgooien; levens aangevuld tot max. 3.');
   }else{
     say('❌ '+label+' — mis. '+p.other+' heeft nummer '+p.opp+'.');
   }
 }

 if(g.over){render();return;}
 render();

 if(g.dartsLeft===0) endTurn();
}

function askMultiplier(n,p){
 // Voor elk raak nummer vragen we single/double/triple.
 // Een misser kan simpelweg via "Miss".
 const answer=prompt(
   'Je raakte nummer '+n+'.\\n\\nTyp 1 voor SINGLE\\nTyp 2 voor DOUBLE\\nTyp 3 voor TRIPLE\\nTyp 0 voor MISSER',
   '1'
 );
 if(answer===null)return null;
 const m=parseInt(answer,10);
 if(![0,1,2,3].includes(m)){alert('Kies 0, 1, 2 of 3.');return null;}
 if(m===0){g.throws[g.throws.length-1]='Misser';return 1;}
 return m;
}

function endTurn(){
 if(g.over)return;
 if(g.dartsLeft===3)return;
 if(g.dartsLeft>0)g.throws.push(...Array(g.dartsLeft).fill('Geen pijl'));
 const old=g.t;
 g.t=g.t===1?2:1;
 g.dartsLeft=3;
 g.throws=[];
 render();

 if(g.bot && g.t===2 && !g.over) setTimeout(botTurn,700);
 else say('Nieuwe beurt: '+(g.t===1?g.a:g.b)+'. 3 pijlen.');
}

function botTurn(){
 if(g.over)return;
 g.botBusy=true;
 g.t=2;g.dartsLeft=3;g.throws=[];
 render();
 say('🤖 '+g.b+' is aan het gooien...');

 let i=0;
 function one(){
   if(g.over){g.botBusy=false;return;}
   const p=current();
   let n,m;
   // Bot probeert als Killer eerst zijn eigen levens veilig te houden,
   // en daarna de speler aan te vallen.
   if(p.k){
     const myLives=g.l2;
     if(myLives<3 && Math.random()<0.72){
       n=g.n2;
       m=Math.random()<0.55?2:1; // soms sterk, maar niet perfect
     }else{
       n=(Math.random()<0.62?g.n1:Math.floor(Math.random()*20)+1);
       m=Math.random()<0.25?3:(Math.random()<0.55?2:1);
     }
   }else{
     n=(Math.random()<0.76?g.n2:Math.floor(Math.random()*20)+1);
     m=Math.random()<0.18?3:(Math.random()<0.55?2:1);
   }

   // Bot gebruikt geen prompt: voer de worp direct uit.
   g.throws.push((m===3?'Triple ':m===2?'Double ':'Single ')+n);
   g.dartsLeft--;

   if(!p.k){
     if(n===g.n2){
       g.h2=Math.min(5,g.h2+m);
       if(g.h2>=5)g.k2=true;
       say('🤖 '+g.b+' gooit '+(m===3?'triple ':m===2?'double ':'')+n+'. '+g.h2+'/5.');
     }else say('🤖 '+g.b+' mist.');
   }else{
     if(n===g.n1){
       g.l1=Math.max(0,g.l1-m);
       say('🤖 '+g.b+' raakt jouw '+g.n1+'! Je hebt nog '+g.l1+' levens.');
       if(g.l1<=0){
         g.over=true;$('throw').classList.add('hidden');$('win').classList.remove('hidden');
         $('winmsg').textContent='🏆 '+g.b+' WINT — '+g.a+' IS KNOCKOUT!';
       }
     }else if(n===g.n2){
       g.l2=Math.min(3,g.l2+m);
       say('🤖 '+g.b+' raakt zijn eigen nummer en vult levens aan.');
     }else say('🤖 '+g.b+' mist.');
   }

   render();
   if(g.over){g.botBusy=false;return;}
   if(g.dartsLeft>0)setTimeout(one,450);
   else{
     g.botBusy=false;
     setTimeout(()=>{
       g.t=1;g.dartsLeft=3;g.throws=[];render();
       say('🎯 Aan de beurt: '+g.a+'. 3 pijlen.');
     },600);
   }
 }
 one();
}

$('mode').onchange=()=>{};
</script>
</body>
</html>
